name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: |
          npm ci
          npm run copy-libs

      - name: Créer le projet Android
        run: |
          npx cap add android
          # Autorisation caméra pour le scanner de code-barres
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          # Icône de l'appli (générée depuis resources/icon*.svg)
          cp -r resources/android/res/. android/app/src/main/res/
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ChatMiam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChatMiam-apk
          path: ChatMiam.apk

      - name: Publier une release (téléchargement facile depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chat Miam v1.0.${{ github.run_number }}
          body: Ouvre cette page sur ton téléphone Android et télécharge ChatMiam.apk.
          files: ChatMiam.apk
