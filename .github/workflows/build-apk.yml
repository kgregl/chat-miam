name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: |
          npm ci
          npm run copy-libs

      - name: Télécharger le modèle de reconnaissance d'images
        run: npm run get-model

      - name: Créer le projet Android
        run: |
          npx cap add android
          # Autorisation caméra pour le scanner de code-barres
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          # Icône de l'appli (générée depuis resources/icon*.svg)
          cp -r resources/android/res/. android/app/src/main/res/
          # Moteur JS du plugin de tâches en arrière-plan (alertes de rappel)
          sed -i "s#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'\n        dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'#" android/app/build.gradle
          grep -n "flatDir" -A3 android/app/build.gradle
          # Notifications (Android 13+)
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          # Numéro de version qui augmente à chaque compilation (permet la mise à jour)
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Clé de signature fixe (mises à jour sans désinstaller)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          # Signature toujours avec la même clé (sinon Android refuse la mise à jour)
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER sign --ks ../signing/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out ../ChatMiam.apk app/build/outputs/apk/debug/app-debug.apk
          $APKSIGNER verify --print-certs ../ChatMiam.apk | tee ../cert.txt

      - name: Texte de la release
        run: |
          echo "Ouvre cette page sur ton téléphone Android et télécharge ChatMiam.apk." > release.md
          echo "" >> release.md
          echo "Signature : $(grep -m1 'SHA-256' cert.txt)" >> release.md

      - uses: actions/upload-artifact@v4
        with:
          name: ChatMiam-apk
          path: ChatMiam.apk

      - name: Publier une release (téléchargement facile depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chat Miam v1.0.${{ github.run_number }}
          body_path: release.md
          files: ChatMiam.apk
